<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #faf5ec; --surface: #fffdf8; --surface-2: #f3ebdd; --ink: #2b2118; --muted: #6e6254;
  --line: #e3d7c3; --accent: #b5532a; --accent-ink: #fff; --focus: #1f6feb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1814; --surface: #27211b; --surface-2: #322a22; --ink: #f3ebdf; --muted: #b3a593;
          --line: #443a2f; --accent: #e0814f; --accent-ink: #1d1814; --focus: #79b0ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
header { text-align: center; padding: 40px 20px 20px; }
h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 2.4rem; color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--muted); }
.actions { margin-top: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 20px 48px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
.photo { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 10px rgba(60, 40, 20, .08); display: flex; flex-direction: column; }
.frame { position: relative; background: var(--surface-2); line-height: 0; }
.frame img { display: block; width: 100%; height: auto; }
.frame .before { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0; transition: opacity .2s; }
.photo.show-before .before { opacity: 1; }
figcaption { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
figcaption p { margin: 0; }
.cap { font-size: 1.05rem; }
.dec { color: var(--accent); font-weight: 600; font-size: .9rem; }
.fn { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; padding: 8px 20px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
button:hover { border-color: var(--accent); }
.toggle { margin-top: 10px; align-self: flex-start; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.print-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
footer { text-align: center; color: var(--muted); font-size: .9rem; padding: 0 20px 32px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 1.9rem; } }
@media print {
  @page { margin: 14mm; }
  body { background: #fff; color: #000; font-size: 14pt; }
  header { padding: 0 0 8mm; }
  h1 { color: #000; }
  .actions, .toggle, footer { display: none !important; }
  main { padding: 0; max-width: none; }
  .grid { display: block; }
  .photo { break-inside: avoid; page-break-after: always; border: 0; box-shadow: none; background: none; border-radius: 0; }
  .photo:last-child { page-break-after: auto; }
  .frame { background: none; text-align: center; }
  .frame img.after { width: auto; max-width: 100%; max-height: 190mm; margin: 0 auto; }
  .frame .before { display: none; }
  figcaption { text-align: center; padding: 6mm 0 0; }
  .dec { color: #444; }
  .fn { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{COUNT}} · made on {{DATE}}</p>
  <div class="actions"><button type="button" class="print-btn" id="print">Print this album</button></div>
</header>
<main>
  <div class="grid">
{{PHOTOS}}
  </div>
</main>
<footer>Restored with Revive. These photos were made on your own computer and never left it.</footer>
<script>
document.querySelectorAll(".toggle").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var fig = btn.closest(".photo");
    var on = fig.classList.toggle("show-before");
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? "Show the restored photo" : "Show the original";
  });
});
document.getElementById("print").addEventListener("click", function () { window.print(); });
</script>
</body>
</html>
